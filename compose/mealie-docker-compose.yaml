version: '3.8'

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.9.2
    container_name: mealie
    restart: always
    ports:
      - "9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: UTC
      BASE_URL: https://mealie.kaijuvault.net
      DEFAULT_GROUP: Home
      DEFAULT_HOUSEHOLD: House of Kaiju
      API_PORT: 9000

volumes:
  mealie-data:
