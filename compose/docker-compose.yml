services:

#################
# RADARR
#################

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    privileged: true
    group_add:
      - "44"
      - "992"
    volumes:
      - /mnt/user/appdata/radarr:/config
      - /mnt/user/data:/data
    restart: unless-stopped

#################
# SONARR
#################

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/sonarr:/config
      - /mnt/user/data:/data
    restart: unless-stopped

#################
# PROWLARR
#################

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/prowlarr:/config
    restart: unless-stopped

#################
# QBITTORRENT
#################

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/user/appdata/qbittorrent:/config
      - /mnt/user/data/torrents:/downloads
    restart: unless-stopped

#################
# CROSS-SEED
#################

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    user: "1000:1000"
    command: daemon
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - /mnt/user/appdata/cross-seed:/config
      - /mnt/user/data/torrents:/downloads
    restart: unless-stopped

#################
# JELLYFIN
#################

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"
    environment:
      - JELLYFIN_FFmpeg__probesize=50M
      - JELLYFIN_FFmpeg__analyzeduration=50M
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/jellyfin:/config
      - /mnt/user/appdata/jellyfin-cache:/cache
      - /mnt/user/data/media/tv:/data/tvshows
      - /mnt/user/data/media/movies:/data/movies
      - /mnt/user/data/media/anime:/data/anime
      - /mnt/user/appdata/jellyfin-cache/transcodes:/transcodes
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      
    restart: unless-stopped

#################
# SONARR-ANIME
#################

  sonarr-anime:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-anime
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/sonarr-anime:/config
      - /mnt/user/data:/data
    ports:
      - "8990:8989"
    restart: unless-stopped
#################
# GLUETUN
#################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"
    ports:
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 9696:9696 #prowlarr
      - 8080:8080 #qbittorrent
      - 6881:6881 #qbittorrent
      - 6881:6881/udp #qbittorrent
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=united states
      - FIREWALL_INPUT_PORTS=${FIREWALL_INPUT_PORTS}
    restart: unless-stopped

#################
# JELLYSEERR
#################

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - /mnt/user/appdata/jellyseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

#################
#WIZARR
#################

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    ports:
      - 5690:5690
    volumes:
      - /mnt/user/appdata/wizarr:/data
    environment:
      - PUID=1000
      - PGID=1000
      - DISABLE_BUILTIN_AUTH=false
      - TZ=America/New_York
    restart: unless-stopped


#################
# NGINX PROXY MANAGER
#################

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    networks:
      default:
        aliases:
          - npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /mnt/user/appdata/npm:/data
      - /mnt/user/appdata/npm-letsencrypt:/etc/letsencrypt
    restart: unless-stopped
################
# NOSTALGIA TV
################

  nostalgiatv:
    image: purestream711/nostalgiatv-server:latest
    container_name: nostalgiatv-server
    ports:
      - "19850:19850"
    volumes:
      - /mnt/user/appdata/nostalgiatv/data:/app/data
      - /mnt/user/appdata/nostalgiatv/config:/app/config
      - /mnt/user/appdata/nostalgiatv/logos:/app/logos
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
    restart: unless-stopped


#################
# BAZARR
#################

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/bazarr:/config
      - /mnt/user/data:/data
    ports:
      - 6767:6767
    restart: unless-stopped

#################
# CLOUDFLARED
#################

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run kaijuvault
    volumes:
      - /mnt/user/appdata/cloudflared:/etc/cloudflared
    restart: unless-stopped

################
# AUDIOBOOKSHELF
################


  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "13378:80"
    volumes:
      - /mnt/user/data/media/audiobooks:/audiobooks
      - /mnt/user/data/media/podcasts:/podcasts
      - /mnt/user/appdata/audiobookshelf/config:/config
      - /mnt/user/appdata/audiobookshelf/metadata:/metadata
    environment:
      - TZ=America/New_York
    restart: unless-stopped


