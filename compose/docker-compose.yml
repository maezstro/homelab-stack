services:

#################
# NGINX PROXY MANAGER
#################

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    networks:
      default:
        aliases:
          - npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /mnt/user/appdata/npm:/data
      - /mnt/user/appdata/npm-letsencrypt:/etc/letsencrypt
    restart: unless-stopped

#################
# CLOUDFLARED
#################

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run kaijuvault
    volumes:
      - /mnt/user/appdata/cloudflared:/etc/cloudflared
    restart: unless-stopped

